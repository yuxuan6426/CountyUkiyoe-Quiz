name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quiz-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: yuxuan6426/CountyUkiyoe
          ref: 6c4154d4f5bf903d3ce6e944507a6106e23bc854
          path: .gallery-source
          sparse-checkout: gallery
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - run: node --test tests/quiz.test.mjs
      - run: python build.py --site-url https://yuxuan6426.github.io/CountyUkiyoe-Quiz/
      - run: python build.py --output artifacts/wiki --site-url https://quiz.yuxuan.wiki/
      - run: |
          (cd dist && sha256sum --strict --quiet -c release.sha256)
          (cd artifacts/wiki && sha256sum --strict --quiet -c release.sha256)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the quiz
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
